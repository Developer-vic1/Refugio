# Ejemplo de VirtualHost manual para Laragon + Apache.
# Ajusta la ruta si Laragon está instalado en otra unidad o carpeta.
# Debe reemplazar al vhost automático: evita mantener ambos habilitados.
<VirtualHost *:80>
    ServerName refugio.test
    DocumentRoot "C:/laragon/www/refugio/public"
    <Directory "C:/laragon/www/refugio/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "C:/laragon/www/refugio/storage/logs/apache-error.log"
    CustomLog "C:/laragon/www/refugio/storage/logs/apache-access.log" combined
</VirtualHost>
